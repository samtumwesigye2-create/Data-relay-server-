<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Data Relay Server</title><style>body{font-family:system-ui;background:#0b1020;color:#eef2ff;margin:0;padding:20px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}input,button{padding:10px;border-radius:8px;border:1px solid #334155;background:#111827;color:#fff}button{cursor:pointer;touch-action:manipulation}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:#111827;border:1px solid #1f2937;border-radius:12px;padding:14px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px;border-bottom:1px solid #1f2937;text-align:left}.muted{color:#94a3b8}.bad{color:#fca5a5}.ok{color:#86efac}.warn{color:#fde68a}#message{min-height:22px;margin-bottom:14px}</style></head><body><h1>Data Relay Server</h1><p class="muted">Independent observability, accountability and integrity console</p><form id="refreshForm" class="bar"><input id="key" type="password" placeholder="DRS API key" autocomplete="off"><button id="refreshBtn" type="submit">Refresh</button></form><div id="message" class="muted">Enter the DRS API key, then refresh.</div><div class="grid"><div class="card"><b>Events (1h)</b><div id="eventsCount">-</div></div><div class="card"><b>Open alerts</b><div id="alertsCount">-</div></div><div class="card"><b>Integrity</b><div id="integrity">-</div></div><div class="card"><b>Relay</b><div id="health">Checking…</div></div></div><h2>Core services</h2><div class="card"><table><thead><tr><th>Service</th><th>Role</th><th>Credentials</th><th>Status</th><th>Last seen</th></tr></thead><tbody id="serviceRows"></tbody></table></div><h2>Recent audit trail</h2><div class="card"><table><thead><tr><th>Who</th><th>What</th><th>When</th><th>How</th><th>Resource</th><th>Result</th></tr></thead><tbody id="auditRows"></tbody></table></div><script>
const el=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function healthCheck(){try{const r=await fetch('/health?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const h=await r.json();el('health').textContent=h.status||'healthy';el('health').className='ok';return true}catch(e){el('health').textContent='Offline';el('health').className='bad';return false}}
async function api(path){const k=el('key').value.trim();if(!k)throw new Error('Enter the DRS API key.');const sep=path.includes('?')?'&':'?';const r=await fetch(path+sep+'ts='+Date.now(),{headers:{'X-API-Key':k},cache:'no-store'});if(r.status===401)throw new Error('API key rejected. Use DRS_API_KEY from the Data Relay service.');if(r.status===503)throw new Error('DRS_API_KEY is not configured on the Data Relay service.');if(!r.ok)throw new Error(path+' returned HTTP '+r.status);return r.json()}
async function refreshAll(){const btn=el('refreshBtn');btn.disabled=true;btn.textContent='Loading…';el('message').textContent='Connecting…';el('message').className='muted';try{const online=await healthCheck();if(!online)throw new Error('Data Relay health check failed.');const d=await api('/dashboard');el('eventsCount').textContent=d.events_in_window;el('alertsCount').textContent=d.open_alerts;const i=await api('/integrity/verify');el('integrity').textContent=i.ok?'Verified':'Mismatch';el('integrity').className=i.ok?'ok':'bad';const s=await api('/service-status');el('serviceRows').innerHTML=(s.services||[]).map(x=>`<tr><td><b>${esc(x.display_name)}</b><br><span class="muted">${esc(x.service_id)}</span></td><td>${esc(x.role)}</td><td class="${x.credential_configured?'ok':'warn'}">${x.credential_configured?'Configured':'Not configured'}</td><td class="${x.state==='online'?'ok':(x.state==='stale'?'warn':'muted')}">${esc(x.state)}</td><td>${x.last_seen?new Date(x.last_seen*1000).toLocaleString():'—'}</td></tr>`).join('');const a=await api('/audit/events?limit=50');el('auditRows').innerHTML=(a.results||[]).map(x=>`<tr><td>${esc(x.who)}</td><td>${esc(x.what)}</td><td>${new Date((x.occurred_at||0)*1000).toLocaleString()}</td><td>${esc([x.how_method,x.how_channel,x.ip_address].filter(Boolean).join(' / '))}</td><td>${esc(x.resource)}</td><td>${esc(x.result)}</td></tr>`).join('');el('message').textContent='Dashboard connected.';el('message').className='ok'}catch(e){el('message').textContent=e.message||String(e);el('message').className='bad'}finally{btn.disabled=false;btn.textContent='Refresh'}}
el('refreshForm').addEventListener('submit',e=>{e.preventDefault();refreshAll()});
el('refreshBtn').addEventListener('touchend',e=>{e.preventDefault();refreshAll()},{passive:false});
healthCheck();
</script></body></html>
