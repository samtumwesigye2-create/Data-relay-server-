<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Data Relay Server</title><style>body{font-family:system-ui;background:#0b1020;color:#eef2ff;margin:0;padding:20px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}input,button{padding:10px;border-radius:8px;border:1px solid #334155;background:#111827;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:#111827;border:1px solid #1f2937;border-radius:12px;padding:14px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px;border-bottom:1px solid #1f2937;text-align:left}.muted{color:#94a3b8}.bad{color:#fca5a5}.ok{color:#86efac}.warn{color:#fde68a}</style></head><body><h1>Data Relay Server</h1><p class="muted">Independent observability, accountability and integrity console</p><div class="bar"><input id="key" type="password" placeholder="DRS API key"><button onclick="refreshAll()">Refresh</button></div><div class="grid"><div class="card"><b>Events (1h)</b><div id="eventsCount">-</div></div><div class="card"><b>Open alerts</b><div id="alertsCount">-</div></div><div class="card"><b>Integrity</b><div id="integrity">-</div></div><div class="card"><b>Relay</b><div id="health">-</div></div></div><h2>Core services</h2><div class="card"><table><thead><tr><th>Service</th><th>Role</th><th>Credentials</th><th>Status</th><th>Last seen</th></tr></thead><tbody id="serviceRows"></tbody></table></div><h2>Recent audit trail</h2><div class="card"><table><thead><tr><th>Who</th><th>What</th><th>When</th><th>How</th><th>Resource</th><th>Result</th></tr></thead><tbody id="auditRows"></tbody></table></div><script>async function api(path){const k=document.getElementById('key').value;const r=await fetch(path,{headers:{'x-api-key':k}});if(!r.ok)throw new Error(await r.text());return r.json()}async function refreshAll(){try{const [d,a,h,i,s]=await Promise.all([api('/dashboard'),api('/audit/events?limit=50'),fetch('/health').then(r=>r.json()),api('/integrity/verify'),api('/service-status')]);eventsCount.textContent=d.events_in_window;alertsCount.textContent=d.open_alerts;health.textContent=h.status;integrity.textContent=i.ok?'Verified':'Mismatch';integrity.className=i.ok?'ok':'bad';serviceRows.innerHTML=(s.services||[]).map(x=>`<tr><td><b>${esc(x.display_name)}</b><br><span class="muted">${esc(x.service_id)}</span></td><td>${esc(x.role)}</td><td class="${x.credential_configured?'ok':'warn'}">${x.credential_configured?'Configured':'Not configured'}</td><td class="${x.state==='online'?'ok':(x.state==='stale'?'warn':'muted')}">${esc(x.state)}</td><td>${x.last_seen?new Date(x.last_seen*1000).toLocaleString():'—'}</td></tr>`).join('');auditRows.innerHTML=(a.results||[]).map(x=>`<tr><td>${esc(x.who||'')}</td><td>${esc(x.what||'')}</td><td>${new Date((x.occurred_at||0)*1000).toLocaleString()}</td><td>${esc([x.how_method,x.how_channel,x.ip_address].filter(Boolean).join(' / '))}</td><td>${esc(x.resource||'')}</td><td>${esc(x.result||'')}</td></tr>`).join('')}catch(e){health.textContent='Error';console.error(e)}}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}</script></body></html>
